[package]
name = "birdman-game-host"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native server administration for shared Birdman application sessions"

[[bin]]
name = "birdman-game-server"
path = "src/bin/server.rs"
required-features = ["server-ui"]

# The live-clock journey runs explicitly with the production release profile.
[[test]]
name = "remote_session"
path = "tests/remote_session.rs"
test = false

[features]
server-ui = ["dep:eframe"]

[dependencies]
birdman-game-native-io.workspace = true
birdman-game-runtime.workspace = true
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "wayland", "x11"], optional = true }

[dev-dependencies]
birdman-game-app.workspace = true
birdman-game-presentation.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.53.2", default-features = false, features = ["sync"] }

[lints]
workspace = true
